<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Sentinel: scheduling and orchestration</title>
<desc>launchd starts sentinel_pipeline.py; the daily and Saturday jobs, how success is judged, what each run writes, notifications and optional publishing.</desc>
<style>
  .t  { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .tt { font-size: 18px; font-weight: 600; fill: #2C2C2A; }
  .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
  .box { fill: #FFFFFF; stroke: #888780; }
  .c-teal  > rect, rect.c-teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal  > .th { fill: #085041; }  .c-teal  > .ts { fill: #0F6E56; }
  .c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber > .th { fill: #633806; }  .c-amber > .ts { fill: #854F0B; }
  .c-gray  > rect, rect.c-gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray  > .th { fill: #444441; }  .c-gray  > .ts { fill: #5F5E5A; }
  .panel { fill: none; stroke: #B4B2A9; }
  .pill { fill: #2C2C2A; }  .pilltext { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="900" fill="#FFFFFF"/>
<text class="tt" x="35" y="22" text-anchor="start" dominant-baseline="central">Schedule, jobs, checks and notifications (Oct 24, 2026)</text>
<g><rect class="box" x="35" y="44" width="930" height="56" rx="6" stroke-width="0.5"/><text class="th" x="500.0" y="63.0" text-anchor="middle" dominant-baseline="central">Scheduler: launchd (installed by sentinel_schedule.py)</text><text class="ts" x="500.0" y="81.0" text-anchor="middle" dominant-baseline="central">Daily: Mon-Fri 16:30 ET · retry Tue-Sat 08:15 ET (silent unless a problem or a new alert)   ·   Weekly: SATURDAY 09:30 ET</text></g>
<line x1="500" y1="102" x2="500" y2="122" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="124" width="930" height="46" rx="6" stroke-width="0.5"/><text class="th" x="500.0" y="138.0" text-anchor="middle" dominant-baseline="central">sentinel_pipeline.py</text><text class="ts" x="500.0" y="156.0" text-anchor="middle" dominant-baseline="central">One command per job · a failed, hung or empty step never stops the steps after it (decisions 41-42)</text></g>
<text class="th" x="35" y="192" text-anchor="start" dominant-baseline="central">daily job (weekdays)</text>
<text class="th" x="520" y="192" text-anchor="start" dominant-baseline="central">weekly job (Saturday)</text>
<g class="c-teal"><rect x="35" y="206" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="257.5" y="214.0" text-anchor="middle" dominant-baseline="central">1. quotes</text><text class="ts" x="257.5" y="232.0" text-anchor="middle" dominant-baseline="central">sentinel_scan.py --quotes</text></g>
<g class="c-teal"><rect x="35" y="246" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="257.5" y="254.0" text-anchor="middle" dominant-baseline="central">2. calendar</text><text class="ts" x="257.5" y="272.0" text-anchor="middle" dominant-baseline="central">sentinel_calendar.py --site  (Calendar tab)</text></g>
<line x1="257.5" y1="240" x2="257.5" y2="245" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="286" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="257.5" y="294.0" text-anchor="middle" dominant-baseline="central">3. news</text><text class="ts" x="257.5" y="312.0" text-anchor="middle" dominant-baseline="central">sentinel_news.py --site  (Holdings tab: Finviz + Finnhub + SEC + capped search)</text></g>
<line x1="257.5" y1="280" x2="257.5" y2="285" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="326" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="257.5" y="334.0" text-anchor="middle" dominant-baseline="central">4. tier1</text><text class="ts" x="257.5" y="352.0" text-anchor="middle" dominant-baseline="central">sentinel_tier1.py</text></g>
<line x1="257.5" y1="320" x2="257.5" y2="325" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="366" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="257.5" y="374.0" text-anchor="middle" dominant-baseline="central">5. reviews page</text><text class="ts" x="257.5" y="392.0" text-anchor="middle" dominant-baseline="central">sentinel_reviews_page.py --site  (Weekly reviews tab)</text></g>
<line x1="257.5" y1="360" x2="257.5" y2="365" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="406" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="257.5" y="414.0" text-anchor="middle" dominant-baseline="central">6. site</text><text class="ts" x="257.5" y="432.0" text-anchor="middle" dominant-baseline="central">sentinel_publish.py: commit site/data + reviews, push</text></g>
<line x1="257.5" y1="400" x2="257.5" y2="405" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="206" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="214.0" text-anchor="middle" dominant-baseline="central">1. scan + dossier</text><text class="ts" x="742.5" y="232.0" text-anchor="middle" dominant-baseline="central">sentinel_scan.py --dossier</text></g>
<g class="c-teal"><rect x="520" y="246" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="254.0" text-anchor="middle" dominant-baseline="central">2. tracked dossiers</text><text class="ts" x="742.5" y="272.0" text-anchor="middle" dominant-baseline="central">--dossier-only --held --watch</text></g>
<line x1="742.5" y1="240" x2="742.5" y2="245" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="286" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="294.0" text-anchor="middle" dominant-baseline="central">3. tier1</text><text class="ts" x="742.5" y="312.0" text-anchor="middle" dominant-baseline="central">sentinel_tier1.py (the new screen's candidates)</text></g>
<line x1="742.5" y1="280" x2="742.5" y2="285" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="326" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="334.0" text-anchor="middle" dominant-baseline="central">4. tier2</text><text class="ts" x="742.5" y="352.0" text-anchor="middle" dominant-baseline="central">sentinel_tier2.py: Claude reviews open alerts (Pro plan, $0)</text></g>
<line x1="742.5" y1="320" x2="742.5" y2="325" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="366" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="374.0" text-anchor="middle" dominant-baseline="central">5. reviews page</text><text class="ts" x="742.5" y="392.0" text-anchor="middle" dominant-baseline="central">sentinel_reviews_page.py  (the Weekly reviews tab)</text></g>
<line x1="742.5" y1="360" x2="742.5" y2="365" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="406" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="414.0" text-anchor="middle" dominant-baseline="central">6. site</text><text class="ts" x="742.5" y="432.0" text-anchor="middle" dominant-baseline="central">sentinel_publish.py: commit site/data + reviews, push</text></g>
<line x1="742.5" y1="400" x2="742.5" y2="405" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="520" y="446" width="445" height="34" rx="6" stroke-width="0.5"/><text class="th" x="742.5" y="454.0" text-anchor="middle" dominant-baseline="central">7. backup</text><text class="ts" x="742.5" y="472.0" text-anchor="middle" dominant-baseline="central">SQLite backup API, verified, newest kept</text></g>
<line x1="742.5" y1="440" x2="742.5" y2="445" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="35" y="488" width="930" height="62" rx="6" stroke-width="0.5"/><text class="th" x="500.0" y="501.0" text-anchor="middle" dominant-baseline="central">Success is judged from research.db, not the exit code (decision 42)</text><text class="ts" x="500.0" y="519.0" text-anchor="middle" dominant-baseline="central">quotes: enough tracked US names have the expected close · calendar: the page was rewritten · scan: a NEW run was saved</text><text class="ts" x="500.0" y="537.0" text-anchor="middle" dominant-baseline="central">tier2: reviews were stored in tier2_reviews (or 'nothing to review') · backup: PRAGMA integrity_check</text></g>
<text class="th" x="35" y="576" text-anchor="start" dominant-baseline="central">What each run writes</text>
<g class="c-gray"><rect x="35" y="590" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="147.5" y="604.0" text-anchor="middle" dominant-baseline="central">logs/*.log</text><text class="ts" x="147.5" y="622.0" text-anchor="middle" dominant-baseline="central">Full output</text></g>
<g class="c-gray"><rect x="270" y="590" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="382.5" y="604.0" text-anchor="middle" dominant-baseline="central">logs/status.json</text><text class="ts" x="382.5" y="622.0" text-anchor="middle" dominant-baseline="central">Read by 'status'</text></g>
<g class="c-gray"><rect x="505" y="590" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="617.5" y="604.0" text-anchor="middle" dominant-baseline="central">backups/db/</text><text class="ts" x="617.5" y="622.0" text-anchor="middle" dominant-baseline="central">Saturday, verified</text></g>
<g class="c-gray"><rect x="740" y="590" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="852.5" y="604.0" text-anchor="middle" dominant-baseline="central">site/data/*.json</text><text class="ts" x="852.5" y="622.0" text-anchor="middle" dominant-baseline="central">committed and pushed</text></g>
<text class="th" x="35" y="664" text-anchor="start" dominant-baseline="central">Notifications: one line per run, tickers and verdicts only</text>
<g class="c-teal"><rect x="35" y="678" width="300" height="50" rx="6" stroke-width="0.5"/><text class="th" x="185.0" y="694.0" text-anchor="middle" dominant-baseline="central">macOS notification</text><text class="ts" x="185.0" y="712.0" text-anchor="middle" dominant-baseline="central">Built: every run (decision 50)</text></g>
<g class="c-teal"><rect x="350" y="678" width="300" height="50" rx="6" stroke-width="0.5"/><text class="th" x="500.0" y="694.0" text-anchor="middle" dominant-baseline="central">iPhone via ntfy.sh</text><text class="ts" x="500.0" y="712.0" text-anchor="middle" dominant-baseline="central">Same line, urgent on FAIL/new; tap opens the site</text></g>
<g><rect class="box" x="665" y="678" width="300" height="50" rx="6" stroke-width="0.5" style="stroke-dasharray:4 3"/><text class="th" x="815.0" y="694.0" text-anchor="middle" dominant-baseline="central">healthchecks.io</text><text class="ts" x="815.0" y="712.0" text-anchor="middle" dominant-baseline="central">Not built: alerts if the Mac never runs</text></g>
<text class="th" x="35" y="756" text-anchor="start" dominant-baseline="central">The public site (decision 57): fjmartinez0.github.io/sentinel, everything published by choice</text>
<g class="c-teal"><rect x="35" y="770" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="147.5" y="784.0" text-anchor="middle" dominant-baseline="central">git commit (on the Mac)</text><text class="ts" x="147.5" y="802.0" text-anchor="middle" dominant-baseline="central">hook: no keys, tokens, .env, db</text></g>
<g class="c-teal"><rect x="270" y="770" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="382.5" y="784.0" text-anchor="middle" dominant-baseline="central">git push</text><text class="ts" x="382.5" y="802.0" text-anchor="middle" dominant-baseline="central">repo fjmartinez0/sentinel (public)</text></g>
<line x1="262" y1="793" x2="268" y2="793" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="505" y="770" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="617.5" y="784.0" text-anchor="middle" dominant-baseline="central">GitHub Actions</text><text class="ts" x="617.5" y="802.0" text-anchor="middle" dominant-baseline="central">checks again: secrets + site files</text></g>
<line x1="497" y1="793" x2="503" y2="793" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="740" y="770" width="225" height="46" rx="6" stroke-width="0.5"/><text class="th" x="852.5" y="784.0" text-anchor="middle" dominant-baseline="central">GitHub Pages</text><text class="ts" x="852.5" y="802.0" text-anchor="middle" dominant-baseline="central">static page loads data/*.json</text></g>
<line x1="732" y1="793" x2="738" y2="793" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="836" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="48.0" y="845.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="69" y="845" text-anchor="start" dominant-baseline="central">Python code</text>
