<text class="ts" x="192.1" y="845" text-anchor="start" dominant-baseline="central">File you edit by hand</text>
<g class="c-gray"><rect x="342.2" y="836" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="355.2" y="845.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="376.2" y="845" text-anchor="start" dominant-baseline="central">File the code creates</text>
<g><rect class="box" x="526.3" y="836" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="539.3" y="845.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="560.3" y="845" text-anchor="start" dominant-baseline="central">Outside service</text>
