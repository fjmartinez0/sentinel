<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Sentinel: the database</title>
<desc>The 12 tables in research.db, grouped by the program that writes them, and which program reads which tables.</desc>
<style>
  .t  { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .tt { font-size: 18px; font-weight: 600; fill: #2C2C2A; }
  .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
  .box { fill: #FFFFFF; stroke: #888780; }
  .c-teal  > rect, rect.c-teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal  > .th { fill: #085041; }  .c-teal  > .ts { fill: #0F6E56; }
  .c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber > .th { fill: #633806; }  .c-amber > .ts { fill: #854F0B; }
  .c-gray  > rect, rect.c-gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray  > .th { fill: #444441; }  .c-gray  > .ts { fill: #5F5E5A; }
  .panel { fill: none; stroke: #B4B2A9; }
  .pill { fill: #2C2C2A; }  .pilltext { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="920" fill="#FFFFFF"/>
<text class="tt" x="35" y="22" text-anchor="start" dominant-baseline="central">research.db: 12 tables, schema v7 (Oct 18, 2026)</text>
<g class="c-teal"><rect x="35" y="44" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="130.0" y="59.0" text-anchor="middle" dominant-baseline="central">Scanner</text><text class="ts" x="130.0" y="77.0" text-anchor="middle" dominant-baseline="central">Writes 5 tables</text></g>
<line x1="205" y1="94" x2="205" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="205" y1="172" x2="205" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="265" y="44" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="360.0" y="59.0" text-anchor="middle" dominant-baseline="central">Calendar</text><text class="ts" x="360.0" y="77.0" text-anchor="middle" dominant-baseline="central">Writes 4 tables</text></g>
<line x1="435" y1="94" x2="435" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="435" y1="172" x2="435" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="495" y="44" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="590.0" y="59.0" text-anchor="middle" dominant-baseline="central">Tier 1</text><text class="ts" x="590.0" y="77.0" text-anchor="middle" dominant-baseline="central">Writes 2 tables</text></g>
<line x1="665" y1="94" x2="665" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="665" y1="172" x2="665" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="725" y="44" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="820.0" y="59.0" text-anchor="middle" dominant-baseline="central">Tier 2</text><text class="ts" x="820.0" y="77.0" text-anchor="middle" dominant-baseline="central">Writes 1 table</text></g>
<line x1="895" y1="94" x2="895" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="895" y1="172" x2="895" y2="214" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="35" y="124" width="880" height="46" rx="6" stroke-width="0.5"/><text class="th" x="475.0" y="138.0" text-anchor="middle" dominant-baseline="central">sentinel_db.py (+ sentinel_schema.sql)</text><text class="ts" x="475.0" y="156.0" text-anchor="middle" dominant-baseline="central">The gate: every read and write goes through it · migrations are append-only (7 so far)</text></g>
<rect class="panel" x="35" y="216" width="880" height="440" rx="8" stroke-width="0.8"/>
<text class="th" x="55" y="238" text-anchor="start" dominant-baseline="central">research.db</text>
<text class="th" x="40" y="266" text-anchor="start" dominant-baseline="central">Written by the scanner</text>
<g class="c-gray"><rect x="35" y="282" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="130.0" y="298.0" text-anchor="middle" dominant-baseline="central">screen_runs</text><text class="ts" x="130.0" y="316.0" text-anchor="middle" dominant-baseline="central">One row per scan</text></g>
<g class="c-gray"><rect x="35" y="344" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="130.0" y="360.0" text-anchor="middle" dominant-baseline="central">screen_results</text><text class="ts" x="130.0" y="378.0" text-anchor="middle" dominant-baseline="central">Each hit, raw JSON</text></g>
<g class="c-gray"><rect x="35" y="406" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="130.0" y="422.0" text-anchor="middle" dominant-baseline="central">screen_tags</text><text class="ts" x="130.0" y="440.0" text-anchor="middle" dominant-baseline="central">HELD, WATCH, NEW ...</text></g>
<g class="c-gray"><rect x="35" y="468" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="130.0" y="484.0" text-anchor="middle" dominant-baseline="central">dossier_snapshots</text><text class="ts" x="130.0" y="502.0" text-anchor="middle" dominant-baseline="central">Parsed quote pages</text></g>
<g class="c-gray"><rect x="35" y="530" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="130.0" y="546.0" text-anchor="middle" dominant-baseline="central">price_history</text><text class="ts" x="130.0" y="564.0" text-anchor="middle" dominant-baseline="central">Daily close and change</text></g>
<text class="th" x="270" y="266" text-anchor="start" dominant-baseline="central">Written by the calendar</text>
<g class="c-gray"><rect x="265" y="282" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="360.0" y="298.0" text-anchor="middle" dominant-baseline="central">calendar_runs</text><text class="ts" x="360.0" y="316.0" text-anchor="middle" dominant-baseline="central">One row per page build</text></g>
<g class="c-gray"><rect x="265" y="344" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="360.0" y="360.0" text-anchor="middle" dominant-baseline="central">earnings_events</text><text class="ts" x="360.0" y="378.0" text-anchor="middle" dominant-baseline="central">Held, watch, candidates</text></g>
<g class="c-gray"><rect x="265" y="406" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="360.0" y="422.0" text-anchor="middle" dominant-baseline="central">quote_snapshots</text><text class="ts" x="360.0" y="440.0" text-anchor="middle" dominant-baseline="central">Live quotes, opt-in</text></g>
<g class="c-gray"><rect x="265" y="468" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="360.0" y="484.0" text-anchor="middle" dominant-baseline="central">positions_snapshots</text><text class="ts" x="360.0" y="502.0" text-anchor="middle" dominant-baseline="central">Copy of positions.yaml</text></g>
<text class="th" x="500" y="266" text-anchor="start" dominant-baseline="central">Written by Tier 1</text>
<g class="c-gray"><rect x="495" y="282" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="590.0" y="298.0" text-anchor="middle" dominant-baseline="central">escalations</text><text class="ts" x="590.0" y="316.0" text-anchor="middle" dominant-baseline="central">The alert queue</text></g>
<g class="c-gray"><rect x="495" y="344" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="590.0" y="360.0" text-anchor="middle" dominant-baseline="central">tier1_runs</text><text class="ts" x="590.0" y="378.0" text-anchor="middle" dominant-baseline="central">Audit log, near misses</text></g>
<text class="th" x="730" y="266" text-anchor="start" dominant-baseline="central">Written by Tier 2</text>
<g class="c-gray"><rect x="725" y="282" width="190" height="50" rx="6" stroke-width="0.5"/><text class="th" x="820.0" y="298.0" text-anchor="middle" dominant-baseline="central">tier2_reviews</text><text class="ts" x="820.0" y="316.0" text-anchor="middle" dominant-baseline="central">Verdict, scores, cost</text></g>
<text class="ts" x="55" y="610" text-anchor="start" dominant-baseline="central">positions_snapshots holds your cost basis: keep research.db and its backups private.</text>
<text class="ts" x="55" y="630" text-anchor="start" dominant-baseline="central">The calendar can also write price_history (--fmp-history). Backups: backups/db/research_*.db, weekly, newest 8.</text>
<text class="th" x="35" y="690" text-anchor="start" dominant-baseline="central">Who reads whose tables (reads also pass through sentinel_db.py)</text>
<rect class="pill" x="40.75" y="707" width="18.5" height="18" rx="9"/><text class="pilltext" x="50" y="716" text-anchor="middle" dominant-baseline="central">1</text>
<text class="t" x="72" y="716" text-anchor="start" dominant-baseline="central">The calendar reads the scanner's tables: candidates, dossiers, stored prices.</text>
<rect class="pill" x="40.75" y="729" width="18.5" height="18" rx="9"/><text class="pilltext" x="50" y="738" text-anchor="middle" dominant-baseline="central">2</text>
<text class="t" x="72" y="738" text-anchor="start" dominant-baseline="central">Tier 1 reads the calendar's earnings_events: the prints it needs for earnings surprises.</text>
<rect class="pill" x="40.75" y="751" width="18.5" height="18" rx="9"/><text class="pilltext" x="50" y="760" text-anchor="middle" dominant-baseline="central">3</text>
<text class="t" x="72" y="760" text-anchor="start" dominant-baseline="central">Tier 1 reads the scanner's tables: prices (15% moves), dossiers and tags (Funnel B).</text>
<rect class="pill" x="40.75" y="773" width="18.5" height="18" rx="9"/><text class="pilltext" x="50" y="782" text-anchor="middle" dominant-baseline="central">4</text>
<text class="t" x="72" y="782" text-anchor="start" dominant-baseline="central">Tier 2 reads Tier 1's escalations (the open queue) and the scanner's dossier_snapshots.</text>
<rect class="pill" x="40.75" y="795" width="18.5" height="18" rx="9"/><text class="pilltext" x="50" y="804" text-anchor="middle" dominant-baseline="central">5</text>
<text class="t" x="72" y="804" text-anchor="start" dominant-baseline="central">sentinel_pipeline.py reads price_history, screen_runs, escalations and tier2_reviews to judge each step.</text>
<text class="ts" x="35" y="840" text-anchor="start" dominant-baseline="central">The scanner never reads the calendar's, Tier 1's or Tier 2's tables. Tier 2 never changes an alert's status: you do, with</text>
<text class="ts" x="35" y="858" text-anchor="start" dominant-baseline="central">python3 sentinel_tier1.py --mark ID done|dismissed.</text>
<g class="c-teal"><rect x="35" y="884" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="48.0" y="893.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="69" y="893" text-anchor="start" dominant-baseline="central">Python code</text>
<g class="c-amber"><rect x="158.1" y="884" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="171.1" y="893.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="192.1" y="893" text-anchor="start" dominant-baseline="central">File you edit by hand</text>
<g class="c-gray"><rect x="342.2" y="884" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="355.2" y="893.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="376.2" y="893" text-anchor="start" dominant-baseline="central">File the code creates</text>
<g><rect class="box" x="526.3" y="884" width="26" height="18" rx="6" stroke-width="0.5"/><text class="th" x="539.3" y="893.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="560.3" y="893" text-anchor="start" dominant-baseline="central">Outside service</text>
<g><rect class="box" x="673.8" y="884" width="26" height="18" rx="6" stroke-width="0.5" style="stroke-dasharray:4 3"/><text class="th" x="686.8" y="893.0" text-anchor="middle" dominant-baseline="central"></text></g>
<text class="ts" x="707.8" y="893" text-anchor="start" dominant-baseline="central">Dashed: planned, optional or off</text>
</svg>
