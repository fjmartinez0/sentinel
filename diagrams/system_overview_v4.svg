<text class="t" x="72" y="1000" text-anchor="start" dominant-baseline="central">Tier 1 reads prices, earnings, dossiers and tags; writes the alert queue and an audit log</text>
<rect class="pill" x="37.5" y="1011" width="25.0" height="18" rx="9"/><text class="pilltext" x="50" y="1020" text-anchor="middle" dominant-baseline="central">11</text>
<text class="t" x="72" y="1020" text-anchor="start" dominant-baseline="central">Tier 1 report (console) and the open alerts: python3 sentinel_tier1.py --show</text>
<rect class="pill" x="37.5" y="1031" width="25.0" height="18" rx="9"/><text class="pilltext" x="50" y="1040" text-anchor="middle" dominant-baseline="central">12</text>
<text class="t" x="72" y="1040" text-anchor="start" dominant-baseline="central">Investment_Strategy_Framework.md (every review) and positions.yaml (not during a calibration) to Tier 2</text>
<rect class="pill" x="37.5" y="1051" width="25.0" height="18" rx="9"/><text class="pilltext" x="50" y="1060" text-anchor="middle" dominant-baseline="central">13</text>
<text class="t" x="72" y="1060" text-anchor="start" dominant-baseline="central">Tier 2 to and from Claude: Claude Code (claude -p) on your Pro plan, web search, $0; the API is the fallback (decision 55)</text>
<rect class="pill" x="37.5" y="1071" width="25.0" height="18" rx="9"/><text class="pilltext" x="50" y="1080" text-anchor="middle" dominant-baseline="central">14</text>
<text class="t" x="72" y="1080" text-anchor="start" dominant-baseline="central">The tracker's Weekly reviews tab (sentinel_reviews_page.py) and a review file per day: verdict, scores, gate, sources</text>
<rect class="pill" x="37.5" y="1091" width="25.0" height="18" rx="9"/><text class="pilltext" x="50" y="1100" text-anchor="middle" dominant-baseline="central">15</text>
<text class="t" x="72" y="1100" text-anchor="start" dominant-baseline="central">Tier 2 reads open alerts and dossiers; writes tier2_reviews (never changes an alert's status)</text>
<rect class="pill" x="37.5" y="1111" width="25.0" height="18" rx="9"/><text class="pilltext" x="50" y="1120" text-anchor="middle" dominant-baseline="central">16</text>
<text class="t" x="72" y="1120" text-anchor="start" dominant-baseline="central">One summary per run: OK or not, new alerts, Tier 2 verdicts (never prices). Tapping it opens the public site.</text>
<text class="ts" x="35" y="1150" text-anchor="start" dominant-baseline="central">Nothing here trades or edits your files: you decide, then act at your broker.</text>
