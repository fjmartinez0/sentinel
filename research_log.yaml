# research_log.yaml -- every name you have already looked at and decided on, EXCEPT the
# ones positions.yaml already covers (held and watch). The scanner reads both files and
# tags each screen hit: HELD / WATCH from positions.yaml, everything below from here,
# and NEW if it is in neither. Precedence: positions.yaml wins over this file.
#
# Seeded from the Investment Ledger as of Aug 28, 2026 (sections 2-6). YOU are the judge
# of these verdicts; I only transcribed the ledger's own groupings and reasons.
#
# status (the ledger's own vocabulary):
#   disqualified  bear case confirmed in the numbers, or a hard disqualifier
#   passed        looked at, not a dislocation (hot sector cooling, chronic decliner, index overlap)
#   parked        real open question blocks a verdict; needs more information
#   dormant       no active dated catalyst; revisit only on new information
#   removed       taken off the board, with a re-add condition where one was stated
#   closed        a position you held and sold
# reviewed: date of the review if the ledger states one, else null.
# revisit:  the condition that should bring the name back, else null (= do not revisit).
#
# THINGS TO CHECK IN THIS SEED
#  1. Not seeded because the handoff never lists them by name: the July 2026 semiconductor /
#     AI-capex basket (19 names) and the gold/silver miners (10 names). If those tickers hit
#     the screen they will show as NEW. Add them here from your own notes.
#  2. The ledger lists SOFI as both Disqualified and Watch, and RDDT as both "passed on
#     hygiene" and Watch. positions.yaml (watch) wins, so they are NOT repeated here.
#  3. The ledger writes "CSGP/CSGO"; CoStar's ticker is CSGP, so only CSGP is seeded.
#  4. Canadian tickers use the FMP-style .TO suffix (the ledger writes .TSX). Finviz is
#     US-only, so those never hit the screen; they are here for completeness.

