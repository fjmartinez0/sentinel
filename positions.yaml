# Positions you sold. Profit = (exit_price - avg_cost) x shares, in the position's currency. When the ledger only
# kept a return, `return_pct` is used and the profit is shown only if shares and exit price are known.
# post_exit (decision 66): the stock's price at a later check, for the exit review. change_pct = (price - exit) /
# exit: negative = the exit looks right in hindsight, positive = money left on the table. It is an outcome, not a
# grade of the decision, and it is not market-adjusted (the scoreboard, pending, should compare with QQQ).
