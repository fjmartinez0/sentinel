# positions.yaml -- structured facts about what you hold and what you're watching.
#
# Source: Investment Ledger (Stock Sleeve, Master), last updated Aug 28, 2026.
# The yaml is the MASTER for structured fields (shares, cost, targets, GTC, dates,
# gate one-liner). The ledger markdown stays the narrative / reasoning. When a trade
# fills or a target changes, edit THIS file first.
#
# Read by: generate_earnings_calendar.py now; the SQLite seed script later.
# Local use only -- this file contains cost basis and share counts.
#
# Conventions
#   dates ......... YYYY-MM-DD (unquoted is fine)
#   target/stretch  a number, or [low, high] when the ledger gives a range
#   gtc ........... {price, shares} for the resting order, or null if none can exist
#   earnings ...... date (exact, or null) + month "YYYY-MM" (when only the month is known)
#                   + confidence: confirmed | estimated | unconfirmed | unstated
#   events ........ dated gates that are NOT earnings (Analyst Day, trial window...).
#                   Fill in `outcome` once resolved; until then a passed event is flagged.
#   gate .......... ONE line: what am I deciding when this reports? null = none written yet
#   null values are deliberate: the ledger did not state them and I did not guess.

