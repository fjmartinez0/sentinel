# positions.yaml -- structured facts about what you hold, what you're watching and what you sold.
#
# The yaml is the MASTER for structured fields (shares, cost, targets, orders, dates, gates). The ledger markdown
# stays the narrative / reasoning. When a trade fills or a target changes, edit THIS file first.
# Refreshed Oct 31, 2026 from Wealthsimple (Oct 30 closes) and decisions 63-64.
#
# Read by: the calendar, the scanner, Tier 1, Tier 2, and the news step (Holdings tab, including the summary table
# and the closed-positions table). The repository is public by choice (decision 57).
#
# Conventions
#   dates ......... YYYY-MM-DD (unquoted is fine)
#   target ........ the exit target set by framework 1B (decision 63): the lower of the median analyst target and
#                   your own valuation (or the median x 0.90). An investor override may set it LOWER, never higher.
#   target_basis .. one line: how the number was made (source, count, arithmetic) or "override: reason"
#   target_date ... when the target was last set; it is reset after every earnings report
#   stretch ....... retired by decision 63 (leave empty)
#   gtc ........... {price, shares} for the resting order (whole shares only), or null if none can exist
#   earnings ...... next report: date (or null) + month "YYYY-MM" + confidence: confirmed | estimated | unconfirmed | unstated
#   gate .......... ONE measurable test and the report it is decided on (decision 63, point 8)
#   closed ........ positions you sold: exit price and date; profit is computed for the site
#   null values are deliberate: not known, not guessed.

